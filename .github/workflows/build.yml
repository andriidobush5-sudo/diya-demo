name: Build Android APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o DiyaLearningApp_Kotlin_Project.zip -d source

      - name: Fix Java and Kotlin versions
        run: |
          cat >> source/DiyaLearningApp/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle -p source/DiyaLearningApp :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Diya-Demo-APK
          path: source/DiyaLearningApp/app/build/outputs/apk/debug/app-debug.apk
          
