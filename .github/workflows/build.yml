name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip DiyaLearningApp_Kotlin_Project.zip -d source

      - name: Build APK
        run: |
          gradle -p source/DiyaLearningApp :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Diya-Demo-APK
          path: source/DiyaLearningApp/app/build/outputs/apk/debug/app-debug.apk
